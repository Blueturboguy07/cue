# publik dispatches this when a break in the tally is worth trying to fix.
# The agent reproduces first, fixes second, proves it third, and opens a pull
# request. It never merges: a green test suite is not proof of a correct fix,
# and everything downstream of a merge here is a signed release that users
# install.
#
# Required secrets (set once at the organisation level, shared by every app):
#   ANTHROPIC_API_KEY   the org's API key
# GITHUB_TOKEN is provided automatically and needs the permissions below.

name: publik patch agent

on:
  repository_dispatch:
    types: [publik-patch-agent]
  workflow_dispatch:
    inputs:
      break_id:
        description: "Break id from the publik tally"
        required: true
      break_title:
        description: "One-line description of the break"
        required: true
      break_detail:
        description: "Signature, affected versions, sanitized report excerpts"
        required: false
      model:
        description: "Model to use"
        default: claude-opus-5

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One patch attempt per break at a time; a second dispatch should wait
  # rather than open a competing pull request against the same code.
  group: publik-patch-${{ github.event.client_payload.break_id || inputs.break_id }}
  cancel-in-progress: false

# publik telemetry is off on build machines: a test run is not a user.
env:
  DO_NOT_TRACK: "1"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Each app fills this in for its own stack. The agent needs to be able
      # to run the test suite, or it cannot prove anything.
      - name: Set up toolchain
        run: |
          echo "Replace with this repo's setup (node/pnpm, cargo, swift, uv...)"

      - name: Attempt the fix
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: ${{ github.event.client_payload.model || inputs.model || 'claude-opus-5' }}
          # Bounded so a confused run cannot spend the afternoon and the budget.
          claude_args: "--max-turns 40"
          prompt: |
            A break reported by users of this app needs a fix.

            Break id: ${{ github.event.client_payload.break_id || inputs.break_id }}
            Title: ${{ github.event.client_payload.break_title || inputs.break_title }}
            Detail:
            ${{ github.event.client_payload.break_detail || inputs.break_detail }}

            Work in this order and do not skip ahead:

            1. REPRODUCE FIRST. Write a failing test, or a script, that
               demonstrates the break. If you cannot reproduce it, stop and
               open no pull request — say what you tried and what you would
               need. A fix for a bug you never reproduced is a guess.
            2. FIX the root cause, not the symptom. Prefer the smallest change
               that addresses it.
            3. PROVE it: the new test must fail before your change and pass
               after, and the existing suite must stay green.
            4. Open a pull request on a branch named
               `publik-patch/<break-id-short>` whose body contains, verbatim,
               these two trailer lines so publik can track it:

                   Publik-Break-Id: ${{ github.event.client_payload.break_id || inputs.break_id }}
                   Publik-Patch-Job: ${{ github.event.client_payload.patch_job_id }}

               and, above them: how you reproduced it, what the root cause
               was, what you changed and why, and the test evidence.

            Do not merge. Do not push to the default branch. A human reviews
            this before it reaches a signed release.

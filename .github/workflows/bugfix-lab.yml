name: bugfix-lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "oracle (primary, default) or negative-control (pre-fix commit + bare npm, evidence only)"
        required: false
        default: "oracle"

jobs:
  oracle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run oracle (cue-dist-win-build-fails)
        if: ${{ github.event.inputs.mode != 'negative-control' }}
        shell: pwsh
        run: |
          .\scripts\bugfix-lab\cue-dist-win-build-fails.ps1

      - name: Run negative control (cue-dist-win-build-fails)
        if: ${{ github.event.inputs.mode == 'negative-control' }}
        shell: pwsh
        run: |
          .\scripts\bugfix-lab\cue-dist-win-build-fails-negative-control.ps1

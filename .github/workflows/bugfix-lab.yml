name: bugfix-lab

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "optional --force-device-scale-factor (diagnostic only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  observe:
    name: cue-20261019-c0d7c6 toolbar drag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run the oracle script
        shell: pwsh
        env:
          LAB_SCALE: ${{ inputs.scale }}
        run: .\scripts\bugfix-lab\cue-20261019-c0d7c6.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugfix-lab-evidence
          path: |
            bugfix-lab-desktop.png
            cue-main-process.log
            cue-main-process.log.err
          if-no-files-found: warn

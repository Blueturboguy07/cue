name: bugfix-lab

on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: "Commit SHA, tag or branch of cue to run the oracle against"
        required: true

permissions:
  contents: read

jobs:
  oracle:
    name: cue-windows-whisper-runtime-missing
    runs-on: windows-latest
    steps:
      - name: Checkout tooling (this branch)
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Checkout target ref under test
        uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ inputs.test_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the oracle script (CUE_BUNDLE_WHISPER left unset, as in the guide)
        id: oracle
        shell: pwsh
        working-directory: target
        run: |
          & "${{ github.workspace }}\tooling\scripts\bugfix-lab\cue-windows-whisper-runtime-missing.ps1"
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "ORACLE_EXIT=$code"
          exit 0

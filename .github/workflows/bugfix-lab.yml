name: bugfix-lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stockwin (default, oracle v2) | oracle (v1, runner-policy shell) | negative-control (v1)"
        required: false
        default: "stockwin"
      app_ref:
        description: "app commit the guide pins (sourceCommit) for stockwin mode"
        required: false
        default: "90aa366ce27e8ae9f5b86f8cffa791338abdd9a2"
      dist_cmd:
        description: "the guide's 'Build the installer' command, verbatim"
        required: false
        default: "npm.cmd run dist:win"

jobs:
  oracle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run oracle v2 (stock Windows execution policy)
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'stockwin' }}
        shell: pwsh
        run: |
          .\scripts\bugfix-lab\cue-dist-win-stockwin.ps1 -AppRef '${{ github.event.inputs.app_ref }}' -DistCmd '${{ github.event.inputs.dist_cmd }}'

      - name: Run oracle v1 (cue-dist-win-build-fails)
        if: ${{ github.event.inputs.mode == 'oracle' }}
        shell: pwsh
        run: |
          .\scripts\bugfix-lab\cue-dist-win-build-fails.ps1

      - name: Run negative control v1 (cue-dist-win-build-fails)
        if: ${{ github.event.inputs.mode == 'negative-control' }}
        shell: pwsh
        run: |
          .\scripts\bugfix-lab\cue-dist-win-build-fails-negative-control.ps1

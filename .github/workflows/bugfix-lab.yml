name: bugfix-lab

# Recipe: publik-loop LAB.md, "controlled environment" section.
# Run scripts/bugfix-lab/<key>.ps1 on a Windows runner.
# The script prints BUGFIX_LAB_PRESENT (exit 1) or BUGFIX_LAB_ABSENT (exit 0).
on:
  workflow_dispatch:
    inputs:
      key:
        description: "Script key. Runs scripts/bugfix-lab/<key>.ps1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lab:
    name: bugfix-lab ${{ inputs.key }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run scripts/bugfix-lab/${{ inputs.key }}.ps1
        shell: pwsh
        env:
          LAB_KEY: ${{ inputs.key }}
        run: ./scripts/bugfix-lab/$env:LAB_KEY.ps1

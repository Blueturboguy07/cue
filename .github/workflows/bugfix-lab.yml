name: bugfix-lab

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  observe:
    name: cue-windows-multiline-paste-collapses-commands
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Run the oracle script
        id: oracle
        shell: pwsh
        run: |
          .\scripts\bugfix-lab\cue-windows-multiline-paste-collapses-commands.ps1
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $code
        continue-on-error: true

      - name: Report the oracle's verdict
        shell: pwsh
        run: |
          Write-Host "Oracle exit code: ${{ steps.oracle.outputs.exit_code }}"

      - name: Fail the job when the oracle could not run
        if: always() && steps.oracle.outputs.exit_code == '2'
        shell: pwsh
        run: exit 1

name: Build and Release

on:
  push:
    tags:
      - 'v*' # Automatically trigger when you push a new version tag (e.g., v0.2.0)

permissions:
  contents: write

# publik telemetry is off on build machines: a test run is not a user.
env:
  DO_NOT_TRACK: "1"

jobs:
  guard:
    # A release whose files were built by publik-build.yml, then signed,
    # notarized and checked on the release Mac, waits as a DRAFT that already
    # holds every file. Publishing that draft creates the tag, and the tag
    # starts this workflow. It must not build again and put unchecked files
    # over the checked ones. So: when a release (draft or public) for this tag
    # already holds files, nothing below runs. The normal path (push the tag
    # first, no release yet) builds as before. If the check itself fails, the
    # build does not run.
    name: Skip when the release already has files
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Count the files of the release for this tag
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          counts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .assets | length')
          files=$(printf '%s\n' "$counts" | awk '{ total += $1 } END { print total + 0 }')
          if [ "$files" -gt 0 ]; then
            echo "Release $GITHUB_REF_NAME already holds $files file(s). Not building: its files stay as they are."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release files for $GITHUB_REF_NAME yet. Building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    env:
      # A runner with no certificate can only produce an ad-hoc macOS build, and
      # macOS refuses those after a download. Publishing one would overwrite a
      # signed release asset with an unopenable one, so the mac upload below is
      # gated on this. Set CSC_LINK and the APPLE_* secrets to turn it on.
      MAC_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Embed publik app token
        # The token is a publishable identifier (it ships in the binary); it lets
        # the publik API gateway attribute this install to cue and rate-limit
        # minting. It is NOT a pk_ key and holds no balance. Written into src/,
        # which the electron-builder.cjs files allowlist already packages.
        # Fails closed: a release without it would ship a build whose provider
        # picker silently lacks the publik option.
        shell: bash
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUBLIK_APP_TOKEN" || { echo "PUBLIK_APP_TOKEN secret is not set"; exit 1; }
          node -e '
            const fs = require("fs"); const p = "src/publik-build.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.appToken = process.env.PUBLIK_APP_TOKEN;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
          '
          node -e 'const c = require("./src/publik-build.json"); if (!c.appToken) process.exit(1); console.log("publik app token embedded for", c.appSlug)'

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac:x64 && npm run dist:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder.cjs signs and notarizes only when MAC_SIGN=1; without
          # these it still builds ad-hoc, so the job keeps working as a build check.
          MAC_SIGN: ${{ secrets.CSC_LINK != '' && '1' || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux x64 and arm64
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux && npm run dist:linux:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        # Skipped on macOS until signing is configured, so an ad-hoc build can
        # never replace a signed asset already attached to the release.
        if: matrix.os != 'macos-latest' || env.MAC_SIGNING_CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

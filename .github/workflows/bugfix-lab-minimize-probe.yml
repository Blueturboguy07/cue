name: bugfix-lab-minimize-probe
# MINIMIZE-stage probe for publik-guide-npm-ps1-execution-policy-windows.
# NOT the oracle (oracle.sh / bugfix-lab.yml are unchanged). This is a temporary,
# reverted probe to shrink the input and prove the app source is not part of the
# defect's region: no app repo is checked out at all, and the command is the
# smallest possible bare npm invocation (`npm --version`, no subcommand args).
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Bare npm, no app checkout, runner default policy vs forced Restricted
        shell: powershell
        run: |
          Write-Host "=== MINIMIZE probe: empty dir (no app repo checked out), smallest possible command ==="
          Write-Host "cwd: $(Get-Location)"
          Get-ChildItem | Out-String | Write-Host
          node --version
          Write-Host "--- Get-ExecutionPolicy -List BEFORE any change (runner's own default) ---"
          Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "--- running 'npm --version' under the runner's OWN unmodified policy ---"
          npm --version
          $before = $LASTEXITCODE
          Write-Host "npm --version exit code (unmodified runner policy): $before"
          Write-Host "=== now tighten Process scope only to Restricted (the real Windows client default) ==="
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Restricted -Force
          Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "--- re-running the SAME bare 'npm --version', same empty dir, no app source anywhere ---"
          npm --version
          $after = $LASTEXITCODE
          Write-Host "npm --version exit code (Process-Restricted): $after"
          if ($before -eq 0 -and $after -ne 0) {
            Write-Host "MINIMIZE_PROBE_RESULT: policy-only flip confirmed, app source irrelevant, subcommand irrelevant"
          } else {
            Write-Host "MINIMIZE_PROBE_RESULT: did not flip as expected (before=$before after=$after)"
          }
